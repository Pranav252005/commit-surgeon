<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Commit Surgeon scans a pull request of 22 changes, labels each one, and cuts it into three focused pieces: the fix, the cleanup and the risky changes.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.c{fill:#3A7059;transform-box:fill-box;animation:mv 10s cubic-bezier(.16,1,.3,1) infinite,col 10s linear var(--d) infinite}
@keyframes mv{0%,24%{transform:translate(0,0)}44%,80%{transform:translate(var(--dx),var(--dy))}97%,100%{transform:translate(0,0)}}
@keyframes col{0%{fill:#3A7059}2%,92%{fill:var(--c)}100%{fill:#3A7059}}
.scan{fill:#A8E6D4;animation:sc 10s linear infinite}
@keyframes sc{0%{transform:translateX(0);opacity:1}20%{transform:translateX(1080px);opacity:1}22%,100%{transform:translateX(1080px);opacity:0}}
.lab{opacity:0;animation:lb 10s ease-out infinite}
@keyframes lb{0%,34%{opacity:0}46%,82%{opacity:1}94%,100%{opacity:0}}
.verd{opacity:0;animation:vd 10s ease-out infinite}
@keyframes vd{0%,40%{opacity:0}52%,82%{opacity:1}94%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.c,.scan,.lab,.verd{animation:none}.c{transform:translate(var(--dx),var(--dy));fill:var(--c)}.scan{opacity:0}.lab,.verd{opacity:1}}
</style>
<rect width="1200" height="450" rx="26" fill="#0B2A22"/>
