[project]
name = "commit-surgeon"
version = "0.0.1"
description = "Reviews the shape of a pull request: labels hunks as needed, cleanup or risky, and prints split commands."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "unidiff>=0.7.5",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
]

[project.scripts]
surgeon = "surgeon.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surgeon"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: typer's Option()/Argument() defaults are the intended API

[tool.ruff.lint.per-file-ignores]
"tests/test_diff.py" = ["W293"]  # blank context lines in the sample patches must keep their space

[tool.pytest.ini_options]
testpaths = ["tests"]
